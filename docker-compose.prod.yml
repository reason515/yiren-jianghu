# 《一人江湖》生产部署（G1 脚手架）
# 用法（服务器）：cp .env.example .env 并按需修改；docker compose -f docker-compose.prod.yml up -d
# 说明：postgres/redis 不暴露公网端口；api/worker 由 CD 推送的镜像或本地构建启动；日志 json-file 轮转（每容器 10MB×3）。
name: yiren-jianghu-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/reason515/yiren-jianghu/api:main}
    env_file: .env
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 只绑 loopback：公网入口走主机 Nginx（deploy/nginx.yiren-jianghu.conf），见 deploy/README.md
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    image: ${WORKER_IMAGE:-ghcr.io/reason515/yiren-jianghu/worker:main}
    env_file: .env
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
