# 《一人江湖》机制总表（DC-046）
# 小数值取向（2026-08-10）：历练门槛平方、战力压到千内、气血短打、技能软顶 100/120。
# 已接线机制（A–D / DC-047–049）：后天四维叠算、装备 stats 进战、招式 dodge、加力 jiali、
# 伤势双轨 effQi、运功疗伤/护体、回合 busy、命中 hook、演示毒（默认关闭）。
# DC-050：命中夹逼 hitChanceFloor/Ceil、伤害浮动、弱打强 underdogDamageFloor、performBusyTurns=2。
# DC-051：自然恢复改 xkx heal_up 绝对值（tickSeconds=9.5 + con/内力分母），不再用上限比例。
# DC-055：expGate 目标等级 ≤1 豁免（精耗仍 ×2）；建角赠剑/潜能打通新手村。
# DC-058：移除饱腹/饮水（无 maxFood/maxWater、无 foodPerMin；干粮/清水改回气回精）。
# 改数字或公式只改本文件；控制流仍在 game-core。

coeffs:
  expCurve:
    base: 100
    growth: 1.1
  combat:
    # P2：略降伤害系数，配合气血压缩保持 4–8 回合短打
    weaponDmgPerLevel: 0.4
    forceDmgPerLevel: 0.3
    defenseReduce: 0.5
    # DC-050：加大浮动，接近 xkx「半随机」气质的简化版
    damageVariance: 0.3
    hitChanceFloor: 0.15
    hitChanceCeil: 0.85
    underdogDamageFloor: 0.25
    recoverNeiliPerTurn: 12
    fleeBaseChance: 0.7
    parryDamageFactor: 0.3
    recoverNeiliThreshold: 0.3
    defenseBase: 8
    dodgeBase: 4
    parryBase: 4
    jialiDmgPerLevel: 4
    jialiNeiliPerLevel: 5
    woundFactor: 0.35
    # DC-050：绝招后忙乱 2 回合，放完要挨打
    performBusyTurns: 2
    demoPoisonTurns: 0
    demoPoisonDmg: 3
  afk:
    maxDurationHours: 8
    dailyDiminishRate: 0.5
    studyAttemptsPerHour: 12
    practiceAttemptsPerHour: 12
    dazuoAttemptsPerHour: 12
    tunaAttemptsPerHour: 12
    onlineTickSec: 15
    questOnlineTickSec: 30
    onlineHeartbeatTimeoutSec: 45
    onlineRewardMult: 1.8
    exerciseQiBase: 10
    respirateJingBase: 10
    cultivateForceDiv: 10
    cultivateMaxOverflowMult: 2
  vitals:
    # P2：整体约 ×0.5，手机一局短打
    qiBase: 50
    jingBase: 50
    jingliBase: 50
    qiPerCon: 8
    qiPerStr: 0
    jingPerInt: 8
    forceQiPerLevel: 1
    forceJingPerLevel: 1
    neiliPerLevel: 8
    jingliPerLevel: 2
    neiliToQiDiv: 4
    neiliToJingDiv: 12
  growth:
    learnJingCostBase: 150
    learnTuitionBase: 2
    potentialCostPerLevel: 1
    # P0：历练门槛 = level^2 * 2（exponent=2, divisor=0.5）
    expGateExponent: 2
    expGateDivisor: 0.5
    practiceQiBase: 12
    practiceQiPerLevel: 1
    practicePointsPerAction: 1
    studyJingBase: 40
    firstLearnJingMult: 2
    practicePointsNeededOffset: 1
  pvp:
    dailyChallengeLimit: 5
    kFactor: 32
    seasonWeeks: 6
    eloScale: 400
  economy:
    maxCashflowPerDay: 300
  regen:
    # 对齐 xkx heal_up：每拍 con/3+max_neili/10 等，平均 9.5 秒一拍
    tickSeconds: 9.5
    qiConDiv: 3
    qiNeiliDiv: 10
    jingConDiv: 3
    jingJingliDiv: 10
    jingliAttrDiv: 4
    neiliForceDiv: 2
    minVitalPerTick: 3
    woundCurePerTick: 1
    maxWindowMinutes: 30
  enable:
    basicLevelDivisor: 2
  perform:
    scaleDivisor: 100
  skillPower:
    # P0：战力 ≈ level * weighted / (attrDivisor * levelScale) → 同属性下约等于 level
    attrDivisor: 6
    strWeight: 5
    zeroLevelExpDiv: 50
    minPower: 1
    levelScale: 20

formulas:
  expForNextLevel: "round(base * growth^(level - 1))"
  diminishMultiplier: "fullCycles <= 0 ? 1 : max(0, min(1, (1 - dailyDiminishRate)^fullCycles))"
  # P0：level^2 * 2；DC-055：目标等级 ≤1 豁免（对齐 pkuxkx learn.c 0 级可学）
  expGateRequired: "level <= 1 ? 0 : level^expGateExponent / expGateDivisor"
  potentialCostForNext: "ceil(nextLevel * potentialCostPerLevel)"
  jingCostForLearn: "max(1, ceil(learnJingCostBase / max(1, int))) * (isFirstLearn != 0 ? firstLearnJingMult : 1)"
  practiceCost: "practiceQiBase + level * practiceQiPerLevel"
  practicePointsNeeded: "level + practicePointsNeededOffset"
  studyCost: "max(1, studyJingBase + level)"
  exerciseGain: "1 + floor(forceLevel / cultivateForceDiv)"
  respirateGain: "1 + floor(forceLevel / cultivateForceDiv)"
  maxNeili: "forceLevel * neiliPerLevel"
  maxQi: "qiBase + con * qiPerCon + str * qiPerStr + forceLevel * forceQiPerLevel + floor(forceLevel * neiliPerLevel / neiliToQiDiv)"
  maxJing: "jingBase + int * jingPerInt + forceLevel * forceJingPerLevel + floor(forceLevel * neiliPerLevel / neiliToJingDiv)"
  maxJingli: "jingliBase + forceLevel * jingliPerLevel"
  attackDamageBase: "max(1, atk + weaponLevel * weaponDmgPerLevel + forceLevel * forceDmgPerLevel - def * defenseReduce)"
  moveDamageApplied: "base * (100 + moveDamage) / 100 + forceLevel * moveForce / 100"
  parryDamage: "max(1, round(fullDamage * parryDamageFactor))"
  scalePerformAmount: "amount * (1 + skillRawLevel / scaleDivisor)"
  expectedScore: "1 / (1 + 10^((scoreB - scoreA) / eloScale))"
  effectiveLevel: "floor(basicLevel / basicLevelDivisor) + specialLevel"
  # P0：基底=有效等级（无等级时用历练/zeroLevelExpDiv，并封顶 120）
  skillPowerBase: "level <= 0 ? max(minPower, min(120, floor(combatExp / zeroLevelExpDiv))) : max(minPower, level)"
  skillPowerWeighted: "max(minPower, floor(power * weighted / (attrDivisor * levelScale)))"
  combatantAttack: "str + weaponLevel"
  combatantDefense: "defenseBase + con"
  combatantDodge: "dodgeBase + dex + dodgeLevel"
  combatantParry: "parryBase + parryLevel"

# 大数立方表已退役（小数值）；保留空表以兼容旧校验路径
piecewise: {}

entityIndex:
  npc_battle_rewards:
    path: npcs[].battleRewards
    fields: [exp, potential, silver]
    note: 战胜 battle NPC 固定成长与银两；中期怪已抬到两位数
  npc_min_exp:
    path: npcs[].minExp
    fields: [minExp]
    note: 开战历练门槛（阶梯怪谱）；不足则拒战
  npc_drops:
    path: npcs[].drops
    fields: [itemId, chance, min, max, minExp]
    note: 会话种子掷物
  npc_goods:
    path: npcs[].goods
    fields: [itemId, buy, sell]
    note: 商贩报价唯一来源
  npc_teaches:
    path: npcs[].teaches
    fields: [skillId, maxLevel, tuitionSilver]
    note: 请教目录与学费覆盖；教习上限不超过技能软顶
  grind_hourly:
    path: grind_jobs[].hourlyGain
    fields: [exp, potential, silver]
    note: 离线生计时薪
  grind_round:
    path: grind_jobs[].roundGain
    fields: [exp, potential, silver]
    note: 在线合圈基础奖（再乘 onlineRewardMult）
  grind_jing:
    path: grind_jobs[].jingPerHour
    fields: [jingPerHour]
    note: 离线生计耗精
  move_damage:
    path: moves[].damage
    fields: [damage, force]
    note: 普攻招式伤害/内功百分比
  perform_effect:
    path: performs[].effect.amount
    fields: [amount]
    note: 绝招效果量（再经 scalePerformAmount）
  perform_cost:
    path: performs[].cost
    fields: [qi, jing, neili]
  item_stats:
    path: items[].stats
    fields: [attack, defense]
  quest_rewards:
    path: quests[].rewards
    fields: [exp, potential, silver]
  skill_max_level:
    path: skills[].maxLevel
    fields: [maxLevel]
    note: 首版软顶 basic≤100 / special≤120
