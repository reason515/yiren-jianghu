# 《一人江湖》主机 Nginx 模板（G1）
# 放置：/etc/nginx/conf.d/yiren-jianghu.conf；改域名后 nginx -t && systemctl reload nginx
# 注意：后端 api 只绑 127.0.0.1:<API_PORT>（见 .env）；H5 静态目录在 E 阶段替换 location /。
server {
    listen 80;
    server_name yiren.example.com;   # TODO: 替换为实际域名

    # WebSocket（客户端-服务端事件通道；H5 阶段启用）
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # API 与 H5 入口
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
