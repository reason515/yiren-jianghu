name: Deploy

# CD（脚手架）：推 main 或手动触发时，构建 API 镜像推送 GHCR，SSH 到服务器 docker compose 更新。
# 激活前提：仓库配置 secrets —— DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY；
# 服务器已有 /opt/yiren-jianghu/docker-compose.prod.yml 与 .env。详见 deploy/README.md。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/**"
      - "docker-compose*.yml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        # 未配置 DEPLOY_HOST 时跳过（步骤级 if 支持 secrets 判断），避免每次 push 都失败
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/yiren-jianghu
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d api
            docker image prune -f
