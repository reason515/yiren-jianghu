# 《一人江湖》主机 Nginx 模板（G1 + H5 部署）
# 放置：/etc/nginx/conf.d/yiren-jianghu.conf；改后 nginx -t && systemctl reload nginx
# 结构：H5 静态 SPA（/var/www/yiren/dist，fallback index.html）+ /api 去前缀代理 + /ws 预留
server {
    listen 80;
    server_name _;

    # H5 静态资源（SPA fallback）
    location / {
        root /var/www/yiren/dist;
        try_files $uri /index.html;
    }

    # API：/api/xxx → 127.0.0.1:3000/xxx（H5 构建 VITE_API_BASE=/api）
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket（客户端-服务端事件通道；预留）
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
